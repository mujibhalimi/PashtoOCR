<!doctype html>
<html lang="ps" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pashto OCR</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --border: #2c3a55;
    --accent: #4da3ff;
    --accent-dim: #2f6cb4;
    --text: #e8edf6;
    --muted: #8fa0bd;
    --result-bg: #fdfaf3;
    --result-text: #1d2433;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 2.5rem 1rem;
  }
  h1 { font-size: 1.6rem; margin-bottom: .35rem; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: .95rem; margin-bottom: 2rem; }
  .card {
    width: 100%; max-width: 720px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem;
  }
  #drop {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 2.2rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
    color: var(--muted);
  }
  #drop.hover, #drop:hover { border-color: var(--accent); background: #1e2940; }
  #drop strong { color: var(--text); }
  #file { display: none; }
  .btn {
    display: inline-block; margin-top: 1rem; padding: .55rem 1.4rem;
    background: var(--accent); color: #08111f; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer; font-size: .95rem;
  }
  .btn:disabled { background: var(--accent-dim); cursor: default; opacity: .6; }
  .row { display: flex; gap: .75rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
  #status { color: var(--muted); font-size: .9rem; }
  #status.error { color: #ff8080; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #resultWrap { display: none; margin-top: 1.5rem; }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  .result-head h2 { font-size: 1rem; color: var(--muted); font-weight: 500; }
  .mini {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: .3rem .8rem; cursor: pointer; font-size: .85rem;
  }
  .mini:hover { color: var(--text); border-color: var(--accent); }
  #result {
    direction: rtl; unicode-bidi: plaintext; text-align: right;
    background: var(--result-bg); color: var(--result-text);
    border-radius: 10px; padding: 1.4rem 1.6rem;
    font-family: "Noto Naskh Arabic", "Geeza Pro", "Arabic Typesetting", "Amiri", serif;
    font-size: 1.35rem; line-height: 2.3; white-space: pre-wrap; word-break: break-word;
    max-height: 60vh; overflow-y: auto;
  }
</style>
</head>
<body>
  <h1>Pashto <span>OCR</span></h1>
  <div class="sub">Upload a printed-Pashto image (PNG / JPG) or PDF — get the text back.</div>

  <div class="card">
    <div id="drop">
      <strong>Click to choose a file</strong> or drag &amp; drop it here<br>
      <small>PNG · JPG · PDF (multi-page supported)</small>
      <input id="file" type="file" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp,.pdf">
    </div>
    <div class="row">
      <button class="btn" id="go" disabled>Run OCR</button>
      <div class="spinner" id="spin"></div>
      <div id="status">No file selected.</div>
    </div>

    <div id="resultWrap">
      <div class="result-head">
        <h2 id="resultLabel">Result</h2>
        <div>
          <button class="mini" id="copy">Copy text</button>
          <button class="mini" id="download">Download .txt</button>
        </div>
      </div>
      <div id="result"></div>
    </div>
  </div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const go = document.getElementById('go');
  const status = document.getElementById('status');
  const spin = document.getElementById('spin');
  const resultWrap = document.getElementById('resultWrap');
  const resultEl = document.getElementById('result');
  const resultLabel = document.getElementById('resultLabel');
  let picked = null;

  function setFile(f) {
    picked = f;
    go.disabled = !f;
    status.classList.remove('error');
    status.textContent = f ? `Selected: ${f.name}` : 'No file selected.';
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => setFile(fileInput.files[0] || null));
  ['dragover', 'dragenter'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hover'); }));
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hover'); }));
  drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0] || null));

  go.addEventListener('click', async () => {
    if (!picked) return;
    go.disabled = true;
    spin.style.display = 'inline-block';
    status.classList.remove('error');
    status.textContent = 'Recognizing…';
    resultWrap.style.display = 'none';

    const form = new FormData();
    form.append('file', picked);
    try {
      const res = await fetch('/ocr', { method: 'POST', body: form });
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || res.statusText);
      resultEl.textContent = body.text || '(no text found)';
      resultLabel.textContent = `Result — ${body.filename}`;
      resultWrap.style.display = 'block';
      status.textContent = 'Done.';
    } catch (err) {
      status.classList.add('error');
      status.textContent = `Error: ${err.message}`;
    } finally {
      spin.style.display = 'none';
      go.disabled = false;
    }
  });

  document.getElementById('copy').addEventListener('click', async () => {
    await navigator.clipboard.writeText(resultEl.textContent);
    status.textContent = 'Copied to clipboard.';
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([resultEl.textContent + '\n'], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (picked ? picked.name.replace(/\.[^.]+$/, '') : 'ocr') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
